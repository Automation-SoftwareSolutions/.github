<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disegno Schema Unifilare</title>
<style>
  :root{
    --bg:#eef1f5; --panel:#fff; --ink:#1e2430; --muted:#6a7486; --line:#d9dfe7;
    --accent:#0b6bcb; --accent-soft:#e7f0fc; --ok:#1b8a5a; --danger:#c0392b; --field:#fbfcfe;
    --sidebar:#12233b; --sidebar-ink:#c9d6e6; --sidebar-active:#0b6bcb;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:13px}
  .app{display:flex;height:100vh;overflow:hidden}

  /* Sidebar */
  .sidebar{width:210px;background:var(--sidebar);color:var(--sidebar-ink);display:flex;flex-direction:column;flex-shrink:0}
  .brand{display:flex;align-items:center;gap:9px;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
  .brand .logo{width:28px;height:28px;border-radius:7px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px}
  .brand b{font-size:13.5px;color:#fff;line-height:1.1}
  .brand small{display:block;color:#7f93ad;font-size:10.5px;font-weight:600}
  nav{padding:8px;overflow:auto;flex:1}
  nav .navbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:none;background:transparent;color:var(--sidebar-ink);padding:9px 11px;border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:600;margin-bottom:2px}
  nav .navbtn:hover{background:rgba(255,255,255,.06);color:#fff}
  nav .navbtn.active{background:var(--sidebar-active);color:#fff}
  nav .navbtn .ico{width:18px;text-align:center;font-size:14px}
  nav .navbtn .n{margin-left:auto;background:rgba(255,255,255,.14);border-radius:10px;font-size:10px;padding:1px 7px;font-weight:700}
  .sidebar .foot{padding:10px;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:6px}
  .sidebar .foot button{border:1px solid rgba(255,255,255,.15);background:transparent;color:var(--sidebar-ink);padding:7px;border-radius:7px;cursor:pointer;font-size:11.5px;font-weight:600}
  .sidebar .foot button:hover{background:rgba(255,255,255,.08);color:#fff}
  .sidebar .foot .row{display:flex;gap:6px}
  .sidebar .foot .row button{flex:1}

  /* Main */
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .topbar{background:var(--panel);border-bottom:1px solid var(--line);padding:11px 20px;display:flex;align-items:center;gap:12px}
  .topbar h2{margin:0;font-size:16px}
  .topbar .sub{color:var(--muted);font-size:12px}
  .topbar .sp{margin-left:auto;display:flex;gap:7px}
  .content{flex:1;overflow:auto;padding:20px}
  .sheet{display:none;max-width:1200px}
  .sheet.active{display:block}

  button.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
  button.btn:hover{background:var(--accent-soft);border-color:var(--accent)}
  button.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  button.btn.primary:hover{filter:brightness(1.06)}
  button.btn.ghost{background:transparent}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
  .card h3{margin:0 0 12px;font-size:13.5px;color:var(--accent)}
  .grid{display:grid;gap:11px 14px}
  .g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:1fr 1fr 1fr 1fr}
  label.f{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);font-weight:600}
  label.f input,label.f select,label.f textarea{border:1px solid var(--line);border-radius:6px;padding:7px 8px;font-size:12.5px;background:var(--field);color:var(--ink);width:100%}
  label.f input:focus,label.f select:focus,label.f textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}

  .tools{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
  .tools .spacer{flex:1}
  .tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
  table.grid-tbl{width:100%;border-collapse:collapse;font-size:11.5px}
  table.grid-tbl th{background:#f1f5fa;border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:7px 6px;font-size:10px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);position:sticky;top:0;white-space:nowrap;text-align:left}
  table.grid-tbl td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0}
  table.grid-tbl td input,table.grid-tbl td select{border:none;background:transparent;width:100%;padding:6px 6px;font-size:11.5px;color:var(--ink)}
  table.grid-tbl td input:focus,table.grid-tbl td select:focus{outline:2px solid var(--accent-soft);background:#fff}
  table.grid-tbl td.rowh{background:#f7f9fc;text-align:center;color:var(--muted);font-weight:700;width:30px}
  table.grid-tbl td.act{white-space:nowrap;text-align:center;width:74px;background:#fafbfd}
  .rowbtn{border:none;background:transparent;cursor:pointer;font-weight:700;font-size:13px;padding:3px 5px;color:var(--muted)}
  .rowbtn.del{color:var(--danger)}
  .empty{padding:26px;text-align:center;color:var(--muted);font-size:12.5px}
  .hint{font-size:11.5px;color:var(--muted);line-height:1.55}
  .placeholder-box{border:2px dashed var(--line);border-radius:12px;padding:40px;text-align:center;color:var(--muted);background:#fff}
  .placeholder-box .big{font-size:34px;margin-bottom:8px}

  /* Schema */
  .schema-toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  #schemaCanvas{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:auto;padding:16px}
  #schemaCanvas svg{background:#fff;display:block;margin:0 auto;box-shadow:0 1px 8px rgba(0,0,0,.08)}

  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#12233b;color:#fff;padding:10px 16px;border-radius:8px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}
  .toast.show{opacity:1}
  .pill{font-size:10px;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:2px 7px;font-weight:700}

  @media print{
    .sidebar,.topbar,.schema-toolbar{display:none!important}
    .app,.main,.content{display:block;height:auto;overflow:visible}
    .content{padding:0}
    .sheet{display:none!important}
    .sheet.active{display:block!important}
    #schemaCanvas,#schemaMonoCanvas,#schemaDCCanvas,#schemaPLCCanvas{border:none;padding:0}
    #schemaCanvas svg,#schemaMonoCanvas svg,#schemaDCCanvas svg,#schemaPLCCanvas svg{box-shadow:none;width:100%!important;height:auto!important}
    @page{size:A3 landscape;margin:8mm}
    /* Fascicolo completo: stampa solo #printArea, in ordine */
    body.printing .app{display:none!important}
    body.printing #printArea{display:block!important}
    body.printing .print-page{page-break-after:always;break-after:page;overflow:hidden}
    body.printing .print-page:last-child{page-break-after:auto;break-after:auto}
    /* Ogni schema sta in una sola pagina: SVG con viewBox scalato per rientrare (larghezza+altezza) */
    body.printing .print-page svg{display:block;width:100%!important;height:260mm!important}
  }
  #printArea{display:none}
  #printArea .print-page{padding:0 0 6mm}
  #printArea .print-h{font-size:16px;margin:0 0 8px;color:#111}
  #printArea .dg-tbl{border-collapse:collapse;width:100%;font-size:12px}
  #printArea .dg-tbl td{border:1px solid #999;padding:6px 8px}
  #printArea .dg-tbl td.k{background:#f0f3f7;font-weight:700;width:180px}
</style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">⚡</div>
      <div><b>Disegno Schema Unifilare</b><small>App disegnatore · v2</small></div>
    </div>
    <nav id="nav"></nav>
    <div class="foot">
      <div class="row">
        <button id="btnSave">Salva</button>
        <button id="btnOpen">Apri</button>
      </div>
      <button id="btnExample">Carica esempio</button>
      <button id="btnNew">Nuovo progetto</button>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div>
        <h2 id="sheetTitle">Dati generali</h2>
        <div class="sub" id="sheetSub"></div>
      </div>
      <div class="sp" id="topActions"></div>
    </div>
    <div class="content" id="content"><!-- sheets injected --></div>
  </div>
</div>

<input type="file" id="fileInput" accept="application/json" style="display:none">
<div class="toast" id="toast"></div>
<div id="printArea"></div>

<script>
"use strict";

/* =========================================================
   MODELLO DATI
   ========================================================= */
function emptyProject(){
  return {
    meta:{impianto:"",cliente:"",quadro:"",commessa:"",disegnatore:"",data:"",rev:"Rev.00",foglio:"1 di 1",note:""},
    quadri:[],
    sbarre:[],
    componenti:[],
    partenze:[],
    sbarreMono:[],
    partenzeMono:[],
    sbarreDC:[],
    partenzeDC:[],
    plcModuli:[],
    plcIO:[],
    sicModuli:[],
    sicIO:[],
    plc:{note:"", io:[]}
  };
}
let project = emptyProject();
let schemaOrient = "V";   // layout schema classico (partenze verso il basso); la pagina di stampa è landscape
let uidC = 1;
function uid(){ return "id"+(uidC++)+"_"+Math.floor(performance.now()); }

/* =========================================================
   DEFINIZIONE FOGLI
   ========================================================= */
const SHEETS = [
  {id:"generali", label:"Dati generali", ico:"📋", sub:"Intestazione e cartiglio del disegno"},
  {id:"componenti",label:"Componenti",   ico:"🔧", sub:"Libreria componenti (con Tipo componente)", coll:"componenti"},
  {id:"quadri",   label:"Quadri",        ico:"🗄️", sub:"Elenco dei quadri dell'impianto", coll:"quadri"},
  {id:"sbarre",   label:"Sbarre trifase", ico:"➖", sub:"Sbarre trifase di distribuzione per quadro", coll:"sbarre"},
  {id:"partenze", label:"Partenze trifase", ico:"⬇️", sub:"Circuiti trifase in partenza dai quadri", coll:"partenze"},
  {id:"sbarreMono",label:"Sbarre Monofase",ico:"➖", sub:"Sbarre monofase (generale = trasformatore, con protezione)", coll:"sbarreMono"},
  {id:"partenzeMono",label:"Partenze Monofase",ico:"⬇️", sub:"Circuiti monofase in partenza dalle sbarre monofase", coll:"partenzeMono"},
  {id:"sbarreDC", label:"Sbarre DC",     ico:"➖", sub:"Sbarre DC (generale = alimentatore, con protezione)", coll:"sbarreDC"},
  {id:"partenzeDC",label:"Partenze DC",  ico:"⬇️", sub:"Circuiti DC in partenza dalle sbarre DC", coll:"partenzeDC"},
  {id:"plcModuli",label:"PLC Moduli",    ico:"🖧", sub:"Moduli/rack del PLC (CPU, DI/DO/AI/AO, bus)", coll:"plcModuli"},
  {id:"plcIO",    label:"PLC I/O",       ico:"🔌", sub:"Lista segnali I/O del PLC", coll:"plcIO"},
  {id:"sicModuli",label:"Sicurezza Moduli",ico:"🛡️", sub:"Moduli di sicurezza (relè/F-CPU/F-DI/F-DO)", coll:"sicModuli"},
  {id:"sicIO",    label:"Sicurezza I/O", ico:"🛑", sub:"Catena di sicurezza: emergenze, ripari, reset…", coll:"sicIO"},
  {id:"schema",   label:"Schema trifasico", ico:"📐", sub:"Schema unifilare trifase"},
  {id:"schemaMono",label:"Schema Monofase",ico:"📐", sub:"Schema unifilare monofase"},
  {id:"schemaDC", label:"Schema DC",     ico:"📐", sub:"Schema unifilare DC"},
  {id:"schemaPLC",label:"Schema PLC",    ico:"📐", sub:"Schema I/O del PLC"},
  {id:"schemaSic",label:"Schema Sicurezza",ico:"📐", sub:"Schema della catena di sicurezza"},
  {id:"export",   label:"Export",        ico:"📤", sub:"Esporta PDF, SVG e DXF"}
];

/* =========================================================
   COLONNE DELLE TABELLE
   opts: array | funzione(row)->array. type: text|num|select
   ========================================================= */
const POLI=["1P","1P+N","2P","3P","3P+N","4P"];
const CURVA=["","B","C","D","K","Z"];
const SN=["no","sì"];
const TIPOMOD=["CPU","Alimentatore","DI","DO","DI/DO","AI","AO","AI/AO","RTD","TC","Bus/Nodo","Comunicazione"];
const TIPOSEG=["DI","DO","AI","AO","RTD","TC"];
/* Sicurezza */
const TIPOSIC=["Relè sicurezza","CPU F","Modulo base","F-DI","F-DO","F-DI/DO","Barriera/Light curtain","Bus/Nodo","Altro"];
const TIPOSEGSIC=["F-DI","F-DO","Reset","Feedback/EDM"];
const FUNZSIC=["Emergenza","Riparo/Cancello","Barriera fotoelettrica","Fune a strappo","Reset","Feedback/EDM","Consenso","Muting","Altro"];
function moduloOptsFor(row){          // PLC I/O -> moduli dello stesso quadro
  const q=row.quadro;
  const list=project.plcModuli.filter(m=>!q||m.quadro===q).map(m=>m.sigla).filter(Boolean);
  return [""].concat(list.length?list:project.plcModuli.map(m=>m.sigla).filter(Boolean));
}
function moduloSicOptsFor(row){       // Sicurezza I/O -> moduli di sicurezza dello stesso quadro
  const q=row.quadro;
  const list=project.sicModuli.filter(m=>!q||m.quadro===q).map(m=>m.sigla).filter(Boolean);
  return [""].concat(list.length?list:project.sicModuli.map(m=>m.sigla).filter(Boolean));
}
/* PLC I/O: numero di canali di un modulo per il tipo di segnale (DI/DO/AI/AO).
   Interpreta stringhe come "16", "16DI/16DO", "6DI/4DO/2AI", "4AI/2AO". 0 = sconosciuto. */
function channelCapacity(mod, tipoSeg){
  if(!mod) return 0;
  const s=String(mod.canali||"");
  const m=s.match(new RegExp("(\\d+)\\s*"+tipoSeg,"i"));
  if(m) return +m[1];
  if(/^\d+$/.test(s.trim())){
    const t=String(mod.tipo||"").toUpperCase();
    if(t===tipoSeg || t.indexOf(tipoSeg)>=0) return +s.trim();
  }
  return 0;
}
/* PLC I/O: indirizzamento Siemens a gruppi di 8 bit.
   indice 0..7 -> "a.0".."a.7", 8..15 -> "b.0".."b.7", ecc. */
function chLabel(n){
  const g=Math.floor(n/8);
  const letter=String.fromCharCode(97+g); // 97 = 'a'
  return letter+"."+(n%8);
}
function chIndex(label){
  const m=String(label||"").trim().toLowerCase().match(/^([a-z])\.(\d+)$/);
  if(m) return (m[1].charCodeAt(0)-97)*8 + (+m[2]);
  const n=parseInt(label,10);          // retrocompatibilità: canale scritto come numero
  return isNaN(n)?NaN:n;
}
/* PLC I/O: primo indice canale libero (0-based) per lo stesso modulo e tipo segnale. */
function firstFreeChannel(coll,i){
  const r=project[coll][i];
  if(!r.modulo || !r.tipoSeg) return null;
  const used=new Set();
  project[coll].forEach((o,j)=>{
    if(j===i) return;
    if(o.modulo===r.modulo && o.tipoSeg===r.tipoSeg){
      const n=chIndex(o.canale);
      if(!isNaN(n)) used.add(n);
    }
  });
  let n=0; while(used.has(n)) n++;
  return n;
}
/* Libreria interna codici moduli PLC (autocompilazione offline).
   Si può ampliare: quando serve un codice nuovo, chiedimi e lo cerco online e lo aggiungo qui. */
const MODLIB={
  "6ES7211-1AE40":{tipo:"CPU",marca:"SIEMENS",canali:"6DI/4DO/2AI",descr:"SIMATIC S7-1200 CPU 1211C DC/DC/DC"},
  "6ES7212-1AE40":{tipo:"CPU",marca:"SIEMENS",canali:"8DI/6DO/2AI",descr:"SIMATIC S7-1200 CPU 1212C DC/DC/DC"},
  "6ES7214-1AG40":{tipo:"CPU",marca:"SIEMENS",canali:"14DI/10DO/2AI",descr:"SIMATIC S7-1200 CPU 1214C DC/DC/DC"},
  "6ES7214-1BG40":{tipo:"CPU",marca:"SIEMENS",canali:"14DI/10DO/2AI",descr:"SIMATIC S7-1200 CPU 1214C AC/DC/Relè"},
  "6ES7214-1HG40":{tipo:"CPU",marca:"SIEMENS",canali:"14DI/10DO/2AI",descr:"SIMATIC S7-1200 CPU 1214C DC/DC/Relè"},
  "6ES7215-1AG40":{tipo:"CPU",marca:"SIEMENS",canali:"14DI/10DO/2AI",descr:"SIMATIC S7-1200 CPU 1215C DC/DC/DC"},
  "6ES7221-1BF32":{tipo:"DI",marca:"SIEMENS",canali:"8",descr:"SIMATIC S7-1200 SM 1221, 8 DI 24VDC"},
  "6ES7221-1BH32":{tipo:"DI",marca:"SIEMENS",canali:"16",descr:"SIMATIC S7-1200 SM 1221, 16 DI 24VDC"},
  "6ES7222-1BF32":{tipo:"DO",marca:"SIEMENS",canali:"8",descr:"SIMATIC S7-1200 SM 1222, 8 DQ 24VDC"},
  "6ES7222-1BH32":{tipo:"DO",marca:"SIEMENS",canali:"16",descr:"SIMATIC S7-1200 SM 1222, 16 DQ 24VDC 0,5A"},
  "6ES7222-1HH32":{tipo:"DO",marca:"SIEMENS",canali:"16",descr:"SIMATIC S7-1200 SM 1222, 16 DQ relè"},
  "6ES7223-1BH32":{tipo:"DI/DO",marca:"SIEMENS",canali:"8DI/8DO",descr:"SIMATIC S7-1200 SM 1223, 8 DI/8 DQ 24VDC 0,5A"},
  "6ES7223-1BL32":{tipo:"DI/DO",marca:"SIEMENS",canali:"16DI/16DO",descr:"SIMATIC S7-1200 SM 1223, 16 DI/16 DQ 24VDC"},
  "6ES7223-1PL32":{tipo:"DI/DO",marca:"SIEMENS",canali:"16DI/16DO",descr:"SIMATIC S7-1200 SM 1223, 16 DI/16 DQ relè"},
  "6ES7231-4HD32":{tipo:"AI",marca:"SIEMENS",canali:"4",descr:"SIMATIC S7-1200 SM 1231, 4 AI"},
  "6ES7231-4HF32":{tipo:"AI",marca:"SIEMENS",canali:"8",descr:"SIMATIC S7-1200 SM 1231, 8 AI"},
  "6ES7232-4HB32":{tipo:"AO",marca:"SIEMENS",canali:"2",descr:"SIMATIC S7-1200 SM 1232, 2 AO"},
  "6ES7232-4HD32":{tipo:"AO",marca:"SIEMENS",canali:"4",descr:"SIMATIC S7-1200 SM 1232, 4 AO"},
  "6ES7234-4HE32":{tipo:"AI/AO",marca:"SIEMENS",canali:"4AI/2AO",descr:"SIMATIC S7-1200 SM 1234, 4 AI/2 AO"},
  "6EP1332-1SH43":{tipo:"Alimentatore",marca:"SIEMENS",canali:"",descr:"LOGO! Power 24V/2,5A"},
  "6EP3333-8SB00":{tipo:"Alimentatore",marca:"SIEMENS",canali:"",descr:"SITOP PSU100S 24V/5A"}
};
/* Libreria personale dell'utente: cresce con il pulsante 💾 e resta salvata nel browser. */
let MYLIB={};
try{ MYLIB=JSON.parse(localStorage.getItem("schemaMyLib")||"{}")||{}; }catch(e){ MYLIB={}; }
function saveMyLib(){ try{ localStorage.setItem("schemaMyLib",JSON.stringify(MYLIB)); }catch(e){} }
function lookupModule(code){
  // Confronto ignorando trattini e spazi (i codici Siemens si scrivono con o senza "-")
  const norm=s=>String(s||"").toUpperCase().replace(/[\s-]/g,"");
  const c=norm(code);
  if(!c)return null;
  const find=lib=>{ for(const k in lib){ const kn=norm(k); if(c===kn || c.startsWith(kn) || (c.length>=11 && kn.startsWith(c))) return lib[k]; } return null; };
  return find(MYLIB) || find(MODLIB);   // prima la tua libreria personale, poi quella interna
}
/* Libreria interna codici moduli di SICUREZZA (autocompilazione offline).
   Si amplia come per il PLC: mandami un codice nuovo e lo verifico e aggiungo qui. */
const SICLIB={
  "3SK1111-1AB30":{tipo:"Relè sicurezza",marca:"SIEMENS",contattiNO:"3",contattiNC:"1",canali:"3F-DO/1DO",descr:"SIRIUS 3SK1 base, 24V AC/DC, 3 NO + 1 segnalazione"},
  "3SK1112-1BB40":{tipo:"Relè sicurezza",marca:"SIEMENS",contattiNO:"2",contattiNC:"0",canali:"2F-DO",descr:"SIRIUS 3SK1 standard, uscite elettroniche, 24V DC"},
  "3SK1112-2BB40":{tipo:"Relè sicurezza",marca:"SIEMENS",contattiNO:"3",contattiNC:"1",canali:"3F-DO/1DO",descr:"SIRIUS 3SK1 standard, uscite a relè, 24V DC"},
  "3SK1211-1BB40":{tipo:"Relè sicurezza",marca:"SIEMENS",contattiNO:"2",contattiNC:"0",canali:"2F-DO",descr:"SIRIUS 3SK1 advanced, uscite elettroniche, 24V DC"},
  "3SK1220-1AB40":{tipo:"Modulo base",marca:"SIEMENS",contattiNO:"",contattiNC:"",canali:"",descr:"SIRIUS 3SK1 modulo di espansione uscite"},
  /* Pilz PNOZ (codice = order number) */
  "750103":{tipo:"Relè sicurezza",marca:"PILZ",contattiNO:"2",contattiNC:"0",canali:"2F-DO",descr:"PNOZ s3, 24V DC, 2 contatti di sicurezza (NO)"},
  "750104":{tipo:"Relè sicurezza",marca:"PILZ",contattiNO:"3",contattiNC:"1",canali:"3F-DO/1DO",descr:"PNOZ s4, 24V DC, 3 NO + 1 NC segnalazione"},
  "750105":{tipo:"Relè sicurezza",marca:"PILZ",contattiNO:"",contattiNC:"",canali:"con ritardo",descr:"PNOZ s5, 24V DC, uscite con ritardo + istantanee"},
  "750107":{tipo:"Relè sicurezza",marca:"PILZ",contattiNO:"4",contattiNC:"0",canali:"4F-DO",descr:"PNOZ s7, 24V DC, 4 contatti di sicurezza (NO)"},

function lookupSafety(code){
  const norm=s=>String(s||"").toUpperCase().replace(/[\s-]/g,"");
  const c=norm(code);
  if(!c)return null;
  const find=lib=>{ for(const k in lib){ const kn=norm(k); if(c===kn || c.startsWith(kn) || (c.length>=11 && kn.startsWith(c))) return lib[k]; } return null; };
  return find(MYLIB) || find(SICLIB);   // prima la tua libreria personale, poi quella interna sicurezza
}

function emptyRow(coll){
  const r={_id:uid()};
  COLS[coll].forEach(c=>{ r[c.key]= (c.type==="select" && Array.isArray(c.opts))? (c.opts[0]||"") : ""; });
  if(coll==="partenze"){r.diff="no";r.poli="1P+N";}
  if(coll==="partenzeMono"){r.diff="no";r.poli="1P+N";}
  if(coll==="partenzeDC"){r.diff="no";r.poli="2P";}
  if(coll==="componenti"){r.poli="1P+N";r.simbolo="Auto";}
  if(coll==="sbarreMono"){r.poli="1P+N";}
  if(coll==="sbarreDC"){r.poli="2P";}
  if(coll==="sbarre"){r.poli="4P";}
  if(coll==="plcModuli"){r.tipo="DI";}
  if(coll==="plcIO"){r.tipoSeg="DI";}
  if(coll==="sicModuli"){r.tipo="Relè sicurezza";}
  if(coll==="sicIO"){r.tipoSeg="F-DI";r.funzione="Emergenza";}
  return r;
}

let activeSheet="generali";
const nav=document.getElementById("nav");
const content=document.getElementById("content");
function buildNav(){
  nav.innerHTML="";
  SHEETS.forEach(s=>{
    const b=document.createElement("button");
    b.className="navbtn"+(s.id===activeSheet?" active":"");
    const count = s.coll? `<span class="n">${project[s.coll].length}</span>`:"";
    b.innerHTML=`<span class="ico">${s.ico}</span><span>${s.label}</span>${count}`;
    b.onclick=()=>go(s.id);
    nav.appendChild(b);
  });
}
function go(id){
  activeSheet=id;
  document.querySelectorAll(".sheet").forEach(el=>el.classList.remove("active"));
  const el=document.getElementById("sheet-"+id);
  if(el)el.classList.add("active");
  const meta=SHEETS.find(s=>s.id===id);
  document.getElementById("sheetTitle").textContent=meta.label;
  document.getElementById("sheetSub").textContent=meta.sub;
  buildNav();
  buildTopActions(id);
  // Ridisegna la tabella del foglio così le tendine collegate (Tipo componente,
  // Quadro, Sbarra, Cavo) si ricaricano sempre con i dati aggiornati degli altri fogli.
  if(meta.coll)renderGrid(meta.coll);
  if(id==="schema")renderSchema();
  if(id==="schemaMono")renderSchemaMono();
  if(id==="schemaDC")renderSchemaDC();
  if(id==="schemaPLC")renderSchemaPLC();
  if(id==="schemaSic")renderSchemaSic();
}
function buildTopActions(id){
  const ta=document.getElementById("topActions");
  ta.innerHTML="";
  const coll=SHEETS.find(s=>s.id===id)?.coll;
  if(coll){
    const add=document.createElement("button");add.className="btn primary";add.textContent="+ Aggiungi riga";
    add.onclick=()=>{project[coll].push(emptyRow(coll));renderGrid(coll);buildNav();save();};
    ta.appendChild(add);
  }
  if(id==="schema"){
    const p=document.createElement("button");p.className="btn";p.textContent="Aggiorna";p.onclick=renderSchema;ta.appendChild(p);
  }
  if(id==="schemaMono"){
    const p=document.createElement("button");p.className="btn";p.textContent="Aggiorna";p.onclick=renderSchemaMono;ta.appendChild(p);
  }
  if(id==="schemaDC"){
    const p=document.createElement("button");p.className="btn";p.textContent="Aggiorna";p.onclick=renderSchemaDC;ta.appendChild(p);
  }
  if(id==="schemaPLC"){
    const p=document.createElement("button");p.className="btn";p.textContent="Aggiorna";p.onclick=renderSchemaPLC;ta.appendChild(p);
  }
}

/* =========================================================
   RENDER GRID (tabellari)
   ========================================================= */
function optionsFor(col,row){
  let o = typeof col.opts==="function"? col.opts(row) : col.opts;
  return o||[];
}
function applyCompToFeeder(r,comp){
  // Copia nei campi della partenza i dati del componente selezionato.
  if(comp.poli) r.poli=comp.poli;   // Poli si aggiorna dal componente
  if(comp.in)   r.in=comp.in;       // In (A) si aggiorna dal componente
}
function renderGrid(coll){
  const tbl=document.getElementById("tbl-"+coll);
  if(!tbl)return;
  const cols=COLS[coll];
  let head="<thead><tr><th></th>"+cols.map(c=>`<th style="min-width:${c.w}px">${c.label}</th>`).join("")+"<th></th></tr></thead>";
  const rows=project[coll];
  let body="<tbody>";
  if(rows.length===0){
    body+=`<tr><td colspan="${cols.length+2}"><div class="empty">Nessuna riga. Usa "+ Aggiungi riga".</div></td></tr>`;
  }else{
    rows.forEach((r,i)=>{
      body+=`<tr data-i="${i}"><td class="rowh">${i+1}</td>`;
      cols.forEach(c=>{
        if(c.type==="select"){
          const opts=optionsFor(c,r).map(o=> (typeof o==="object")? o : {v:o, l:(o===""?"—":o)});
          const cur=r[c.key]??"";
          const optHtml=opts.map(o=>`<option value="${esc(o.v)}" ${o.v===cur?"selected":""}>${esc(o.l)}</option>`).join("");
          // se il valore corrente non è tra le opzioni, aggiungilo comunque
          const extra = (cur!=="" && !opts.some(o=>o.v===cur))? `<option value="${esc(cur)}" selected>${esc(cur)}</option>`:"";
          body+=`<td><select data-k="${c.key}">${extra}${optHtml}</select></td>`;
        }else{
          body+=`<td><input data-k="${c.key}" value="${esc(r[c.key])}"></td>`;
        }
      });
      const srchBtn = (coll==="plcModuli"||coll==="sicModuli") ? `<button class="rowbtn savelib" title="Salva questo modulo nella tua libreria personale">💾</button><button class="rowbtn srch" title="Cerca online il codice">🔎</button>` : "";
      body+=`<td class="act">
        ${srchBtn}
        <button class="rowbtn up" title="Su">▲</button>
        <button class="rowbtn dn" title="Giù">▼</button>
        <button class="rowbtn del" title="Elimina">✕</button>
      </td></tr>`;
    });
  }
  body+="</tbody>";
  tbl.innerHTML=head+body;
  // PLC I/O e Sicurezza I/O: evidenzia in rosso la scritta PIENO nel campo Canale
  if(coll==="plcIO"||coll==="sicIO"){
    tbl.querySelectorAll('tbody tr[data-i] [data-k="canale"]').forEach(inp=>{
      const full = String(inp.value).trim().toUpperCase()==="PIENO";
      inp.style.color = full? "#d32f2f" : "";
      inp.style.fontWeight = full? "700" : "";
    });
  }
  // eventi
  tbl.querySelectorAll("tbody tr[data-i]").forEach(tr=>{
    const i=+tr.dataset.i;
    tr.querySelectorAll("[data-k]").forEach(inp=>{
      inp.addEventListener("input",()=>{
        project[coll][i][inp.dataset.k]=inp.value;
        // Partenze: gestione dipendenze Tipo componente / Codice e auto-compilazione Poli e In.
        if(coll==="partenze" && (inp.dataset.k==="tipoComp"||inp.dataset.k==="codice")){
          const r2=project[coll][i];
          if(inp.dataset.k==="tipoComp"){
            // azzera il Codice se non appartiene più al tipo scelto
            const ok=project.componenti.some(c=>c.tipo===r2.tipoComp && c.codice===r2.codice);
            if(!ok)r2.codice="";
            // se quel tipo ha un solo componente, adottalo
            const matches=project.componenti.filter(c=>c.tipo===r2.tipoComp);
            if(matches.length===1){ if(matches[0].codice)r2.codice=matches[0].codice; applyCompToFeeder(r2,matches[0]); }
          }
          if(inp.dataset.k==="codice" && r2.codice){
            const comp=project.componenti.find(c=>c.codice===r2.codice && (!r2.tipoComp||c.tipo===r2.tipoComp))
                    || project.componenti.find(c=>c.codice===r2.codice);
            if(comp)applyCompToFeeder(r2,comp);
          }
        }
        // PLC I/O e Sicurezza I/O: colora in rosso PIENO mentre si digita nel campo Canale.
        if((coll==="plcIO"||coll==="sicIO") && inp.dataset.k==="canale"){
          const full=String(inp.value).trim().toUpperCase()==="PIENO";
          inp.style.color=full?"#d32f2f":""; inp.style.fontWeight=full?"700":"";
        }
        // PLC I/O: scelto Modulo + Tipo segnale, compila il primo canale libero (formato Siemens a.0).
        if(coll==="plcIO" && (inp.dataset.k==="modulo"||inp.dataset.k==="tipoSeg")){
          const r2=project[coll][i];
          if(r2.modulo && r2.tipoSeg){
            const ch=firstFreeChannel(coll,i);
            if(ch!==null){
              const mod=project.plcModuli.find(m=>m.sigla===r2.modulo);
              const cap=channelCapacity(mod,r2.tipoSeg);
              if(cap>0 && ch>=cap){ r2.canale="PIENO"; toast("Modulo "+r2.modulo+" pieno ("+r2.tipoSeg+" "+chLabel(0)+"–"+chLabel(cap-1)+")"); }
              else { r2.canale=chLabel(ch); toast("Canale "+chLabel(ch)+" (primo libero)"); }
            }
          }
        }
        // Sicurezza I/O: scelto Modulo + Tipo, compila il primo canale libero (numerazione semplice 1,2,3…).
        if(coll==="sicIO" && (inp.dataset.k==="modulo"||inp.dataset.k==="tipoSeg")){
          const r2=project[coll][i];
          if(r2.modulo && r2.tipoSeg){
            const used=new Set();
            project.sicIO.forEach((o,j)=>{ if(j===i)return; if(o.modulo===r2.modulo && o.tipoSeg===r2.tipoSeg){ const n=parseInt(o.canale,10); if(!isNaN(n))used.add(n); } });
            let n=1; while(used.has(n)) n++;
            const mod=project.sicModuli.find(m=>m.sigla===r2.modulo);
            const cap=channelCapacity(mod,r2.tipoSeg);
            if(cap>0 && n>cap){ r2.canale="PIENO"; toast("Modulo "+r2.modulo+" pieno ("+r2.tipoSeg+" 1–"+cap+")"); }
            else { r2.canale=String(n); toast("Canale "+n+" (primo libero)"); }
          }
        }
        // Sbarre: se cambio il Tipo del generale, azzero il codice se non è più coerente.
        if(coll==="sbarre" && inp.dataset.k==="genTipo"){
          const r2=project[coll][i];
          const ok=project.componenti.some(c=>c.tipo===r2.genTipo && c.codice===r2.genCodice);
          if(!ok)r2.genCodice="";
        }
        save();
        // Se cambia una tendina, ridisegna la tabella così le colonne dipendenti
        // (es. Codice filtrato per Tipo componente, Sbarra filtrata per Quadro) si aggiornano subito.
        if(inp.tagName==="SELECT"){ renderGrid(coll); }
        if(activeSheet==="schema")renderSchema();
      });
    });
    // PLC/Sicurezza Moduli: autocompilazione dalla libreria quando si finisce di digitare il codice
    if(coll==="plcModuli"||coll==="sicModuli"){
      const codeInp=tr.querySelector('[data-k="codice"]');
      if(codeInp)codeInp.addEventListener("change",()=>{
        const r2=project[coll][i];
        const m=(coll==="sicModuli")?lookupSafety(r2.codice):lookupModule(r2.codice);
        if(m){ Object.keys(m).forEach(k=>{ if(m[k]!==undefined) r2[k]=m[k]; }); save(); renderGrid(coll); toast("Dati modulo compilati dalla libreria"); }
      });
      const sb=tr.querySelector(".srch");
      if(sb)sb.onclick=()=>{ const code=project[coll][i].codice||""; window.open("https://www.google.com/search?q="+encodeURIComponent(code+" datasheet"),"_blank"); };
      const sv=tr.querySelector(".savelib");
      if(sv)sv.onclick=()=>{
        const r=project[coll][i];
        const code=String(r.codice||"").trim();
        if(!code){ toast("Inserisci prima il Codice del modulo"); return; }
        MYLIB[code]={tipo:r.tipo||"",marca:r.marca||"",canali:r.canali||"",descr:r.descr||""};
        saveMyLib();
        toast("Modulo "+code+" salvato nella tua libreria");
      };
    }
    tr.querySelector(".del").onclick=()=>{project[coll].splice(i,1);renderGrid(coll);buildNav();save();};
    tr.querySelector(".up").onclick=()=>{if(i>0){[project[coll][i-1],project[coll][i]]=[project[coll][i],project[coll][i-1]];renderGrid(coll);save();}};
    tr.querySelector(".dn").onclick=()=>{if(i<project[coll].length-1){[project[coll][i+1],project[coll][i]]=[project[coll][i],project[coll][i+1]];renderGrid(coll);save();}};
  });
}
function renderAllGrids(){ ["quadri","sbarre","componenti","partenze","sbarreMono","partenzeMono","sbarreDC","partenzeDC","plcModuli","plcIO","sicModuli","sicIO"].forEach(renderGrid); }

/* =========================================================
   MOTORE DISEGNO  (SVG + DXF)
   ========================================================= */
class Drawing{
  constructor(){this.e=[];this.minX=1e9;this.minY=1e9;this.maxX=-1e9;this.maxY=-1e9;}
  _b(x,y){if(x<this.minX)this.minX=x;if(y<this.minY)this.minY=y;if(x>this.maxX)this.maxX=x;if(y>this.maxY)this.maxY=y;}
  line(x1,y1,x2,y2,l="0"){this.e.push({t:"line",x1,y1,x2,y2,l});this._b(x1,y1);this._b(x2,y2);return this;}
  circle(cx,cy,r,l="0"){this.e.push({t:"circle",cx,cy,r,l});this._b(cx-r,cy-r);this._b(cx+r,cy+r);return this;}
  rect(x,y,w,h,l="0"){this.line(x,y,x+w,y,l).line(x+w,y,x+w,y+h,l).line(x+w,y+h,x,y+h,l).line(x,y+h,x,y,l);return this;}
  poly(p,l="0"){for(let i=0;i<p.length-1;i++)this.line(p[i][0],p[i][1],p[i+1][0],p[i+1][1],l);return this;}
  text(x,y,s,size=3,anchor="start",rot=0,l="TESTI"){
    s=String(s);
    this.e.push({t:"text",x,y,s,size,anchor,rot,l});
    const w=s.length*size*0.62;                       // stima larghezza testo
    const r=((rot||0)%360+360)%360;
    if(r===90||r===270){                              // testo verticale
      this._b(x-size,y);this._b(x+size,y);
      this._b(x,y-w);this._b(x,y+w);
    }else{                                            // testo orizzontale
      this._b(x,y-size);this._b(x,y+size*0.35);
      if(anchor==="middle"){this._b(x-w/2,y);this._b(x+w/2,y);}
      else if(anchor==="end"){this._b(x-w,y);}
      else {this._b(x+w,y);}
    }
    return this;
  }
  toSVG(pad=18){
    const w=(this.maxX-this.minX)+pad*2,h=(this.maxY-this.minY)+pad*2;
    const ox=-this.minX+pad,oy=-this.minY+pad;
    let o=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w.toFixed(1)} ${h.toFixed(1)}" font-family="Arial,Helvetica,sans-serif">`;
    o+=`<rect x="0" y="0" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="#fff"/>`;
    for(const el of this.e){
      if(el.t==="line")o+=`<line x1="${(el.x1+ox).toFixed(2)}" y1="${(el.y1+oy).toFixed(2)}" x2="${(el.x2+ox).toFixed(2)}" y2="${(el.y2+oy).toFixed(2)}" stroke="#111" stroke-width="0.5"/>`;
      else if(el.t==="circle")o+=`<circle cx="${(el.cx+ox).toFixed(2)}" cy="${(el.cy+oy).toFixed(2)}" r="${el.r.toFixed(2)}" fill="none" stroke="#111" stroke-width="0.5"/>`;
      else if(el.t==="text"){
        const a=el.anchor==="middle"?"middle":el.anchor==="end"?"end":"start";
        const tr=el.rot?` transform="rotate(${-el.rot} ${(el.x+ox).toFixed(2)} ${(el.y+oy).toFixed(2)})"`:"";
        o+=`<text x="${(el.x+ox).toFixed(2)}" y="${(el.y+oy).toFixed(2)}" font-size="${el.size}" text-anchor="${a}" fill="#111"${tr}>${esc(el.s)}</text>`;
      }
    }
    o+="</svg>";return{svg:o,w,h};
  }
  toDXF(){
    const fy=y=>(this.maxY-y);const H=[];const p=(c,v)=>{H.push(c);H.push(v);};
    p(0,"SECTION");p(2,"HEADER");p(9,"$INSUNITS");p(70,4);p(0,"ENDSEC");
    p(0,"SECTION");p(2,"TABLES");p(0,"TABLE");p(2,"LAYER");p(70,3);
    const L=(n,c)=>{p(0,"LAYER");p(2,n);p(70,0);p(62,c);p(6,"CONTINUOUS");};
    L("0",7);L("TESTI",3);L("SBARRA",1);p(0,"ENDTAB");p(0,"ENDSEC");
    p(0,"SECTION");p(2,"ENTITIES");
    for(const el of this.e){
      if(el.t==="line"){p(0,"LINE");p(8,el.l);p(10,el.x1.toFixed(3));p(20,fy(el.y1).toFixed(3));p(30,"0.0");p(11,el.x2.toFixed(3));p(21,fy(el.y2).toFixed(3));p(31,"0.0");}
      else if(el.t==="circle"){p(0,"CIRCLE");p(8,el.l);p(10,el.cx.toFixed(3));p(20,fy(el.cy).toFixed(3));p(30,"0.0");p(40,el.r.toFixed(3));}
      else if(el.t==="text"){const ha=el.anchor==="middle"?1:el.anchor==="end"?2:0;p(0,"TEXT");p(8,el.l);p(10,el.x.toFixed(3));p(20,fy(el.y).toFixed(3));p(30,"0.0");p(40,el.size.toFixed(3));p(1,el.s);p(50,(el.rot||0).toFixed(3));if(ha>0){p(72,ha);p(11,el.x.toFixed(3));p(21,fy(el.y).toFixed(3));p(31,"0.0");}}
    }
    p(0,"ENDSEC");p(0,"EOF");
    let s="";for(let i=0;i<H.length;i+=2)s+=H[i]+"\r\n"+H[i+1]+"\r\n";return s;
  }
}
/* ---- Pen: disegna in coordinate (a = lungo la partenza dalla sbarra, p = laterale).
   orient 'V' = partenze verso il basso, orient 'H' = partenze verso destra. ---- */
function feederPen(d,orient,bx,by){
  const T = orient==='H' ? (a,p)=>[bx+a,by+p] : (a,p)=>[bx+p,by+a];
  return {
    orient,
    at:(a,p)=>T(a,p),
    line:(a1,p1,a2,p2,l)=>{const A=T(a1,p1),B=T(a2,p2);d.line(A[0],A[1],B[0],B[1],l);},
    circle:(a,p,r,l)=>{const A=T(a,p);d.circle(A[0],A[1],r,l);},
    rect:(a,p,wa,wp,l)=>{const A=T(a,p),B=T(a+wa,p),C=T(a+wa,p+wp),D=T(a,p+wp);d.line(A[0],A[1],B[0],B[1],l);d.line(B[0],B[1],C[0],C[1],l);d.line(C[0],C[1],D[0],D[1],l);d.line(D[0],D[1],A[0],A[1],l);},
    poly:(pts,l)=>{d.poly(pts.map(pt=>T(pt[0],pt[1])),l);},
    text:(a,p,s,size,anchor,rot,l)=>{const A=T(a,p);d.text(A[0],A[1],s,size,anchor||"start",rot||0,l);}
  };
}
function arcAP(ca,cp,r,d1,d2,steps){const out=[];steps=steps||14;for(let i=0;i<=steps;i++){const t=(d1+(d2-d1)*i/steps)*Math.PI/180;out.push([ca+r*Math.sin(t),cp+r*Math.cos(t)]);}return out;}
// Sinusoide: al variare di p (laterale) oscilla a (lungo la partenza). Un periodo.
function sinePtsAP(cA,p1,p2,amp,steps){const out=[];steps=steps||18;for(let i=0;i<=steps;i++){const t=i/steps;out.push([cA+amp*Math.sin(t*2*Math.PI),p1+(p2-p1)*t]);}return out;}

/* Tipo di protezione da disegnare in cima alla partenza (o "nessuno" se il
   componente non è una protezione: quadro, sbarra, morsetti, motore, ecc.) */
function protKind(comp, tipoTxt){
  const s=(comp&&comp.simbolo&&comp.simbolo!=="Auto")?comp.simbolo.toLowerCase():"";
  const t=((tipoTxt||"")+" "+(comp?((comp.tipo||"")+" "+(comp.descr||"")):"")).toLowerCase();
  if(s==="salvamotore"||/salvamot|guardamot|mpcb/.test(t))return "salvamotore";
  if(s==="termica"|| (/termic/.test(t)&&!/magneto/.test(t)))return "termica";
  if(s==="sezionatore"||/sezion/.test(t))return "sezionatore";
  if(s==="fusibile"||/fusib/.test(t))return "fusibile";
  if(s==="interruttore"||s==="differenziale"||/interr|magnet|scatol|mccb|mcb|differ/.test(t))return "interruttore";
  // simboli non di protezione -> nessun interruttore in cima
  if(["quadro","sbarra","morsetti","motore","presa","lampada","trasformatore","alimentatore","plc","modulo sicurezza","sicurezza","inverter","softstarter","utenza generica"].includes(s))return "nessuno";
  return "interruttore";
}
/* simboli (in coordinate a/p, con offset di partenza a0) */
function symBreakerP(pen,a0,kind){
  if(kind==="nessuno"){ pen.line(a0,0,a0+20,0); return a0+20; }   // solo conduttore
  if(kind==="termica"){                                            // relè termico (senza sezionamento)
    pen.line(a0,0,a0+5,0);
    pen.rect(a0+5,-3.5,9,7);
    pen.line(a0+7,-2,a0+7,2); pen.line(a0+7,2,a0+10,2);           // elemento bimetallico (gancio)
    pen.line(a0+14,0,a0+20,0);
    return a0+20;
  }
  if(kind==="salvamotore"){
    // Salvamotore (MPCB): manettino con "x" + riquadro termico/magnetico a due celle
    pen.line(a0,0,a0+9,0);                       // conduttore fino al riquadro
    pen.line(a0+2,0,a0+6.5,-4.2);                // lama interruttore (obliqua)
    pen.rect(a0+4.6,-3.4,2,2);                   // manettino
    pen.rect(a0+9,-3.2,11,6.4);                  // riquadro protezione
    pen.line(a0+14.5,-3.2,a0+14.5,3.2);          // divisione fra le due celle
    pen.poly([[a0+11,1.6],[a0+11,-1.6],[a0+13,-1.6]]);   // termico (cella alta)
    pen.poly([[a0+18,-1.6],[a0+18,1.6],[a0+16,1.6]]);    // magnetico (cella bassa)
    pen.line(a0+20,0,a0+22,0);                   // conduttore uscita
    return a0+22;
  }
  pen.line(a0,0,a0+2,0);
  pen.circle(a0+2.6,0,0.9);              // perno (uno solo)
  pen.line(a0+2.6,0,a0+8,5);             // lama
  pen.line(a0+8,0,a0+10,0);
  if(kind==="sezionatore"){ pen.line(a0+10,0,a0+18,0); }
  else if(kind==="fusibile"){ pen.rect(a0+10,-2,7,4); pen.line(a0+10,0,a0+17,0); }
  else { pen.rect(a0+10,-2.4,8,4.8); pen.line(a0+18,0,a0+20,0); }  // interruttore
  return a0+20;
}
// Numero di poli da mostrare accanto al trattino obliquo (es. 3P->"3", 3P+N->"3+N").
function poleMark(poli){
  const s=String(poli||"").toUpperCase().replace(/\s/g,"");
  if(!s)return "";
  const m=s.match(/(\d)/);const n=m?m[1]:"";
  return s.includes("+N")?(n+"+N"):n;
}
// Trattino obliquo con numero di poli sul conduttore (convenzione unifilare).
function polesTickP(pen,a,poli){
  pen.line(a+1.6,-2.6,a-1.6,2.6);
  const mk=poleMark(poli);
  if(mk)pen.text(a-0.4,3.4,mk,2.3,"start",0);
}
// Numero di conduttori/poli (per i trattini trasversali): 3P=3, 3P+N=4, 1P+N=2, 4P=4...
function poleConductors(poli){
  const s=String(poli||"").toUpperCase().replace(/\s/g,"");
  let n=0;const m=s.match(/(\d)\s*P/);if(m)n=parseInt(m[1],10);else{const m2=s.match(/^(\d)/);if(m2)n=parseInt(m2[1],10);}
  if(s.includes("+N"))n+=1;
  return n>0?n:1;
}
function symDiffP(pen,a0){ pen.rect(a0,-3,6,6); pen.line(a0+6,-3,a0,3); pen.line(a0+6,0,a0+8,0); return a0+8; }
// Deduce il tipo di simbolo del carico dal componente selezionato.
function symbolFor(comp){
  if(!comp)return "generic";
  let s=(comp.simbolo||"Auto");
  if(s==="Auto"||s===""){
    const t=((comp.tipo||"")+" "+(comp.descr||"")).toLowerCase();
    if(/morsett|terminal/.test(t))return "morsetti";
    if(/termic/.test(t)&&!/magneto/.test(t))return "termica";
    if(/contatt|teleru/.test(t))return "contattore";
    if(/soft|avviat/.test(t))return "softstarter";
    if(/invert|vfd|frequenz|drive/.test(t))return "inverter";
    if(/mot/.test(t))return "motore";
    if(/pres|cee|spina|socket/.test(t))return "presa";
    if(/lamp|illum|luce|faro|plafon|led/.test(t))return "lampada";
    if(/modulo.?sicur|sicurezz|safety|emergenz|e-?stop/.test(t))return "sicurezza";
    if(/\bplc\b|controllore|cpu|siemens.?s7|logo!/.test(t))return "plc";
    if(/quadr|sottoquadr|panel/.test(t))return "quadro";
    if(/aliment|power.?sup|vdc|24\s?v/.test(t))return "alimentatore";
    if(/trasf|traf/.test(t))return "trasformatore";
    if(/sbarr|busbar/.test(t))return "sbarra";
    if(/interr|magnet|scatol|mccb|mcb|sezion|fus|diff/.test(t))return "protezione";
    return "generic";
  }
  s=s.toLowerCase();
  if(/sicurezz/.test(s))return "sicurezza";
  if(s==="modulo sicurezza")return "sicurezza";
  return s;
}
// Disegna il simbolo del carico dalla posizione a0 lungo la partenza. Ritorna la nuova a.
function drawLoadP(pen,a0,kind){
  switch(kind){
    case "motore":
      pen.circle(a0+5,0,5);pen.text(a0+6.3,0,"M",4,"middle",0);return a0+10;
    case "presa":
      pen.poly(arcAP(a0+1,0,4,0,180,14));pen.line(a0+1,-4,a0+1,4);return a0+7;
    case "lampada":
      pen.circle(a0+5,0,5);pen.line(a0+1.5,-3.5,a0+8.5,3.5);pen.line(a0+1.5,3.5,a0+8.5,-3.5);return a0+10;
    case "quadro":
      pen.rect(a0,-6,12,12);pen.line(a0+2,-6,a0+2,6);return a0+12;
    case "morsetti":
      pen.rect(a0,-5,4,10);pen.circle(a0+2,-3,1);pen.circle(a0+2,0,1);pen.circle(a0+2,3,1);return a0+4;
    case "softstarter":
      pen.rect(a0,-6,12,12);pen.poly([[a0+9,-4],[a0+9,-1],[a0+3,4]]);return a0+12;
    case "inverter":
      pen.rect(a0,-6,12,12);pen.text(a0+5,0,"=",3,"middle",0);pen.text(a0+10,0,"~",3,"middle",0);return a0+12;
    case "contattore":
      pen.line(a0,0,a0+1,0);pen.line(a0+1,0,a0+6,3.5);pen.poly(arcAP(a0+6.5,0,1.5,0,180,8));pen.line(a0+6.5,0,a0+8,0);return a0+8;
    case "termica":
      pen.rect(a0,-3.5,9,7);pen.line(a0+2,-2,a0+2,2);pen.line(a0+2,2,a0+5,2);return a0+9;
    case "trasformatore":
      pen.circle(a0+4,0,4);pen.circle(a0+8,0,4);return a0+12;
    case "alimentatore":
      pen.rect(a0,-6,13,12);pen.line(a0+13,-6,a0,6);                       // quadrato + diagonale
      pen.poly(sinePtsAP(a0+3.5,-5,-1,1.4,18));                           // sinusoide (AC) in alto a sx
      pen.line(a0+8.6,1.3,a0+8.6,4.7);                                     // DC: linea piena
      pen.line(a0+10,1.3,a0+10,2.6);pen.line(a0+10,3.4,a0+10,4.7);         // DC: linea tratteggiata
      return a0+13;
    case "plc":
      pen.rect(a0,-6.5,14,13);pen.text(a0+7,1.2,"PLC",3.6,"middle",0);return a0+14;
    case "sicurezza":
      pen.rect(a0,-7,15,14);pen.rect(a0+1.6,-5.4,11.8,10.8);pen.text(a0+7.5,1.2,"SIC",3,"middle",0);return a0+15;
    case "protezione":
      pen.rect(a0,-2.4,8,4.8);return a0+8;
    case "sbarra":
      pen.line(a0+2,-6,a0+2,6);pen.line(a0+3,-6,a0+3,6);return a0+4;
    default:
      pen.circle(a0+5,0,5);return a0+10; // utenza generica
  }
}
// Dispositivo IN SERIE (comando/avviamento) tra protezione e carico: il conduttore prosegue.
function symDeviceP(pen,a0,kind){
  switch(kind){
    case "softstarter":
      pen.rect(a0,-4,10,8);pen.poly([[a0+2.5,3],[a0+4.5,3],[a0+8,-3]]);return a0+10;
    case "inverter":
      pen.rect(a0,-4,10,8);pen.line(a0+2.5,2.5,a0+7.5,-2.5);pen.text(a0+5,3.4,"~",2.4,"middle",0);return a0+10;
    case "contattore":
      pen.line(a0,0,a0+1,0);pen.line(a0+1,0,a0+6,3.5);pen.poly(arcAP(a0+6.5,0,1.5,0,180,8));pen.line(a0+6.5,0,a0+8,0);return a0+8;
    case "termica":
      pen.rect(a0,-3.5,9,7);pen.line(a0+2,-2,a0+2,2);pen.line(a0+2,2,a0+5,2);return a0+9;
    case "trasformatore":
      pen.circle(a0+4,0,4);pen.circle(a0+8,0,4);return a0+12;
    case "alimentatore":
      pen.rect(a0,-6,13,12);pen.line(a0+13,-6,a0,6);                       // quadrato + diagonale
      pen.poly(sinePtsAP(a0+3.5,-5,-1,1.4,18));                           // sinusoide (AC) in alto a sx
      pen.line(a0+8.6,1.3,a0+8.6,4.7);                                     // DC: linea piena
      pen.line(a0+10,1.3,a0+10,2.6);pen.line(a0+10,3.4,a0+10,4.7);         // DC: linea tratteggiata
      return a0+13;
    default:
      pen.rect(a0,-3.5,8,7);return a0+8;   // dispositivo generico
  }
}

/* ---- Una partenza (funzione condivisa a livello modulo) ---- */
function drawFeederInto(d,f,i,bx,by){
  const P=project; const H=(schemaOrient==='H');
  const pen=feederPen(d,schemaOrient,bx,by);
  const comp=(f.codice && P.componenti.find(c=>c.codice===f.codice)) || P.componenti.find(c=>c.tipo===f.tipoComp);
  const tipoTxt=f.tipoComp||"";
  pen.line(0,0,3,0);
  polesTickP(pen,3,f.poli);
  const aB0=5;
  let a=symBreakerP(pen,aB0,protKind(comp,tipoTxt));
  const aBmid=(aB0+a)/2;
  if(f.diff==="sì"){ a=symDiffP(pen,a+1); }
  const avvComp=P.componenti.find(c=>c._id===f.avv);
  let aCmid=null;
  if(avvComp){
    pen.line(a,0,a+2,0); a+=2;
    const aC0=a;
    const dk=symbolFor(avvComp);
    a=symDeviceP(pen,a,["softstarter","inverter","contattore","termica"].includes(dk)?dk:"box");
    aCmid=(aC0+a)/2;
  }
  const nc=poleConductors(f.poli);
  const seg=Math.max(9,nc*2+4);
  pen.line(a,0,a+seg,0);
  for(let k=0;k<nc;k++){const ta=a+3+k*2;pen.line(ta+1.1,-2.2,ta-1.1,2.2);}
  a+=seg;
  const carico=P.componenti.find(c=>c._id===f.carico);
  const kind=carico?symbolFor(carico):"generic";
  const aL0=a;
  const aEnd=drawLoadP(pen,a,kind);
  const aLmid=(aL0+aEnd)/2;
  const lp=7;
  const put=(am,txt,sz)=>{ if(txt) pen.text(am,lp,txt,sz||2.4,"start",0); };
  if(f.codice) put(aBmid, f.codice);                                                          // CODICE
  if(avvComp && aCmid!=null) put(aCmid, (avvComp.tipo||"")+(avvComp.codice?(" "+avvComp.codice):"")); // COMANDO
  if(carico) put(aLmid, (carico.tipo||"")+(carico.codice?(" "+carico.codice):(carico.descr?(" "+carico.descr):""))); // CARICO
  const loadLabel=f.descr || "";
  if(loadLabel){
    if(H) pen.text(aEnd+2,0,loadLabel,2.6,"start",0);
    else  pen.text(aEnd,-7,loadLabel,2.6,"start",90);
  }
}
/* ---- Generale monofase (trasformatore + protezione), livello modulo ---- */
function drawMonoGeneralInto(d,gx,attachY,tComp,pComp,poli){
  const gTop=attachY-48;
  const pen=feederPen(d,'V',gx,gTop);
  d.line(gx,gTop-6,gx,gTop-1);d.poly([[gx-2,gTop-4],[gx,gTop-1],[gx+2,gTop-4]]);   // arrivo
  pen.line(0,0,1,0); pen.circle(4,0,3.5); pen.circle(8.5,0,3.5); pen.line(12,0,14,0);   // trasformatore
  d.text(gx+7,gTop+3,"Trasf: "+((tComp&&tComp.tipo)||"Trasformatore")+((tComp&&tComp.codice)?(" "+tComp.codice):""),2.4,"start",0);
  polesTickP(pen,15.5,poli);
  const a=symBreakerP(pen,17,protKind(pComp,pComp?pComp.tipo:""));
  d.text(gx+7,gTop+20,"Prot: "+((pComp&&pComp.tipo)||"")+((pComp&&pComp.codice)?(" "+pComp.codice):""),2.4,"start",0);
  d.line(gx,gTop+a,gx,attachY);
}
/* ---- Generale DC (alimentatore + protezione), livello modulo ---- */
function drawDCGeneralInto(d,gx,attachY,aComp,pComp,poli){
  const gTop=attachY-56;
  const pen=feederPen(d,'V',gx,gTop);
  d.line(gx,gTop-6,gx,gTop-1);d.poly([[gx-2,gTop-4],[gx,gTop-1],[gx+2,gTop-4]]);   // arrivo AC
  const aA=drawLoadP(pen,0,"alimentatore");                                        // simbolo alimentatore (0..13)
  d.text(gx+9,gTop+5,"Alim: "+((aComp&&aComp.tipo)||"Alimentatore")+((aComp&&aComp.codice)?(" "+aComp.codice):""),2.4,"start",0);
  pen.line(aA,0,aA+2,0);
  polesTickP(pen,aA+3,poli);
  const a=symBreakerP(pen,aA+4,protKind(pComp,pComp?pComp.tipo:""));
  d.text(gx+9,gTop+aA+7,"Prot: "+((pComp&&pComp.tipo)||"")+((pComp&&pComp.codice)?(" "+pComp.codice):""),2.4,"start",0);
  d.line(gx,gTop+a,gx,attachY);
}

/* ============ SCHEMA TRIFASE (principale) ============ */
function buildSchema(quadroSigla){
  const d=new Drawing();
  const P=project;
  const q=P.quadri.find(q=>q.sigla===quadroSigla);
  const allFeeders=P.partenze.filter(f=>!quadroSigla || f.quadro===quadroSigla);
  let sbList=P.sbarre.filter(s=>!quadroSigla || s.quadro===quadroSigla);
  if(sbList.length===0) sbList=[{sigla:"",quadro:quadroSigla,poli:""}];   // fallback: una sbarra generica
  const sigleSet=new Set(sbList.map(s=>s.sigla).filter(Boolean));
  const hasAnyGen = sbList.some(s=>s.genTipo);

  const titleX=30;
  d.text(titleX,8,(quadroSigla||P.meta.quadro||"Quadro"),4,"start",0);
  if(q&&q.descr)d.text(titleX,13,q.descr,2.8,"start",0);

  function genCompOf(sb){ return sb.genTipo?(P.componenti.find(c=>c.codice===sb.genCodice)||P.componenti.find(c=>c.tipo===sb.genTipo)):null; }
  function sbLabel(sb){
    const sc=P.componenti.find(c=>c.tipo===sb.tipoComp);
    const tipoTxt=sb.tipoComp||sb.tipo||"";
    const marca=sb.marca||(sc&&sc.marca)||"";
    const inA=sb.in||(sc&&sc.in)||"";
    return `Sbarra ${sb.sigla||""} ${tipoTxt?("· "+tipoTxt):""} ${sb.poli?("· "+sb.poli):""} ${inA?("· "+inA+"A"):""} ${marca?("· "+marca):""}`.trim();
  }
  function drawGeneral(sb,genComp,gx,attachY){
    const gTop=attachY-34;
    const pen=feederPen(d,'V',gx,gTop);
    d.line(gx,gTop-8,gx,gTop-2);d.poly([[gx-2,gTop-5],[gx,gTop-2],[gx+2,gTop-5]]);
    d.line(gx,gTop-2,gx,gTop);
    const genPoli=(genComp&&genComp.poli)||sb.poli;
    polesTickP(pen,1,genPoli);
    const a=symBreakerP(pen,3,protKind(genComp,sb.genTipo||""));
    d.line(gx,gTop+a,gx,attachY);
    let ay=gTop+3;
    const gput=(s,sz)=>{if(s){d.text(gx+7,ay,s,sz,"start",0);ay+=sz+1.2;}};
    gput("Generale: "+(sb.genTipo||""),2.7);
    gput(`${genPoli||""} ${(genComp&&genComp.in)?("In "+genComp.in+"A"):(sb.in?("In "+sb.in+"A"):"")} ${(genComp&&genComp.curva)?("cr."+genComp.curva):""}`.trim(),2.3);
    gput(`${(genComp&&genComp.kA)?("Icu "+genComp.kA+"kA"):""} ${(genComp&&genComp.marca)||""} ${(genComp&&genComp.codice)||sb.genCodice||""}`.trim(),2.3);
  }
  // feeder assegnati a una sbarra (i non assegnati / non riconosciuti vanno sulla prima)
  function feedersOf(sb,isFirst){ return allFeeders.filter(f=> f.sbarra===sb.sigla || (isFirst && !sigleSet.has(f.sbarra)) ); }

  const x0=30, colW=48;
  const busY = hasAnyGen ? 84 : 48;
  let sx=x0;
  sbList.forEach((sb,si)=>{
    const genComp=genCompOf(sb);
    const hasGen=!!sb.genTipo;
    const feds=feedersOf(sb, si===0);
    const nn=Math.max(feds.length,1);
    const right=sx+Math.max((nn-1)*colW,20);
    if(hasGen) drawGeneral(sb,genComp,sx,busY);
    else { d.line(sx,busY-8,sx,busY);d.poly([[sx-2,busY-5],[sx,busY-2],[sx+2,busY-5]]); }
    d.line(sx,busY,right,busY,"SBARRA");
    d.text(sx,busY-2.5,sbLabel(sb),2.6,"start",0);
    feds.forEach((f,i)=>drawFeederInto(d,f,i,sx+i*colW,busY));
    sx=right+60;   // spazio tra una sbarra e l'altra
  });
  return d;
}

/* ============ SCHEMA MONOFASE (separato) ============ */
function buildSchemaMono(quadroSigla){
  const d=new Drawing();
  const P=project;
  const monoList=P.sbarreMono.filter(s=>!quadroSigla || s.quadro===quadroSigla);
  const q=P.quadri.find(q=>q.sigla===quadroSigla);
  const x0=30, colW=48, busY=100;
  d.text(x0,8,(quadroSigla||P.meta.quadro||"Quadro")+" — Monofase",4,"start",0);
  if(q&&q.descr)d.text(x0,13,q.descr,2.8,"start",0);
  if(monoList.length===0){ d.text(x0,60,"Nessuna sbarra monofase per questo quadro.",3,"start",0); return d; }
  let sx=x0;
  monoList.forEach(mb=>{
    const mbFeeders=P.partenzeMono.filter(f=>f.sbarra===mb.sigla && (!quadroSigla || f.quadro===quadroSigla));
    const nn=Math.max(mbFeeders.length,1);
    const mRight=sx+Math.max((nn-1)*colW,20);
    const tComp=P.componenti.find(c=>c._id===mb.trafo);
    const pComp=P.componenti.find(c=>c._id===mb.prot);
    drawMonoGeneralInto(d,sx,busY,tComp,pComp,mb.poli);
    d.line(sx,busY,mRight,busY,"SBARRA");
    d.text(sx,busY-2.5,`Sbarra monofase ${mb.sigla||""} ${mb.tipo?("· "+mb.tipo):""} ${mb.poli?("· "+mb.poli):""} ${mb.in?("· "+mb.in+"A"):""}`.trim(),2.6,"start",0);
    mbFeeders.forEach((f,i)=>drawFeederInto(d,f,i,sx+i*colW,busY));
    sx=mRight+55;
  });
  return d;
}

/* ============ SCHEMA DC (separato) ============ */
function buildSchemaDC(quadroSigla){
  const d=new Drawing();
  const P=project;
  const dcList=P.sbarreDC.filter(s=>!quadroSigla || s.quadro===quadroSigla);
  const q=P.quadri.find(q=>q.sigla===quadroSigla);
  const x0=30, colW=48, busY=112;
  d.text(x0,8,(quadroSigla||P.meta.quadro||"Quadro")+" — DC",4,"start",0);
  if(q&&q.descr)d.text(x0,13,q.descr,2.8,"start",0);
  if(dcList.length===0){ d.text(x0,60,"Nessuna sbarra DC per questo quadro.",3,"start",0); return d; }
  let sx=x0;
  dcList.forEach(mb=>{
    const mbFeeders=P.partenzeDC.filter(f=>f.sbarra===mb.sigla && (!quadroSigla || f.quadro===quadroSigla));
    const nn=Math.max(mbFeeders.length,1);
    const mRight=sx+Math.max((nn-1)*colW,20);
    const aComp=P.componenti.find(c=>c._id===mb.alim);
    const pComp=P.componenti.find(c=>c._id===mb.prot);
    drawDCGeneralInto(d,sx,busY,aComp,pComp,mb.poli);
    d.line(sx,busY,mRight,busY,"SBARRA");
    d.text(sx,busY-2.5,`Sbarra DC ${mb.sigla||""} ${mb.tipo?("· "+mb.tipo):""} ${mb.poli?("· "+mb.poli):""} ${mb.in?("· "+mb.in+"A"):""}`.trim(),2.6,"start",0);
    mbFeeders.forEach((f,i)=>drawFeederInto(d,f,i,sx+i*colW,busY));
    sx=mRight+55;
  });
  return d;
}

/* ============ SCHEMA PLC (I/O) ============ */
function buildSchemaPLC(quadroSigla){
  const d=new Drawing();
  const P=project;
  const q=P.quadri.find(q=>q.sigla===quadroSigla);
  const mods=P.plcModuli.filter(m=>!quadroSigla || m.quadro===quadroSigla);
  d.text(30,8,(quadroSigla||P.meta.quadro||"Quadro")+" — PLC",4,"start",0);
  if(q&&q.descr)d.text(30,13,q.descr,2.8,"start",0);
  if(mods.length===0){ d.text(30,60,"Nessun modulo PLC per questo quadro (aggiungi in PLC Moduli).",3,"start",0); return d; }
  let y=28;
  mods.forEach(m=>{
    const sigs=P.plcIO.filter(io=>io.modulo===m.sigla && (!quadroSigla || io.quadro===quadroSigla));
    const anyNote=sigs.some(io=>String(io.note||"").trim());
    const sh=anyNote?9:6;            // passo verticale per segnale (più alto se ci sono note)
    const rowH=Math.max(20, sigs.length*sh+8);
    // riquadro modulo (a sinistra)
    d.rect(30,y,44,rowH);
    d.text(33,y+6,(m.sigla||m.tipo||"Modulo"),3.4,"start",0);
    d.text(33,y+11,(m.tipo||""),2.6,"start",0);
    d.text(33,y+15.5,((m.marca?m.marca+" ":"")+(m.codice||"")).trim(),2.3,"start",0);
    if(m.slot)d.text(33,y+19,"slot "+m.slot,2.2,"start",0);
    // segnali (a destra), ognuno con morsetto e sigla
    sigs.forEach((io,k)=>{
      const yy=y+5+k*sh;
      d.line(74,yy,82,yy);            // conduttore dal modulo
      d.circle(83,yy,1);             // morsetto/terminale
      const lab=`${io.tipoSeg||""} ${io.canale?("ch"+io.canale+" "):""}${io.tag?(io.tag+" "):""}${io.indirizzo?("("+io.indirizzo+") "):""}${io.morsetto?("["+io.morsetto+"] "):""}${io.descr||""}`.trim();
      d.text(86,yy+1,lab,2.4,"start",0);
      const note=String(io.note||"").trim();
      if(note)d.text(86,yy+4.2,note,2.1,"start",0);   // 2ª riga: Note
    });
    if(sigs.length){ d.line(74,y+5,74,y+5+(sigs.length-1)*sh); }  // montante segnali
    y+=rowH+8;
  });
  return d;
}

    const anyNote=sigs.some(io=>String(io.note||"").trim());
    const sh=anyNote?9:6;
    const rowH=Math.max(20, sigs.length*sh+8);
    // riquadro modulo (a sinistra)
    d.rect(30,y,44,rowH);
    d.text(33,y+6,(m.sigla||m.tipo||"Modulo"),3.4,"start",0);

      d.text(86,yy+1,lab,2.4,"start",0);

function printAll(){
  const P=project;
  const parts=[ datiGeneraliPrintHTML() ];

  add("Schema trifasico", P.partenze.length>0, ()=>buildSchema(currentQuadro()));
  add("Schema Monofase", P.sbarreMono.length>0, ()=>buildSchemaMono(currentQuadroMono()));
  add("Schema DC", P.sbarreDC.length>0, ()=>buildSchemaDC(currentQuadroDC()));
  add("Schema PLC", P.plcModuli.length>0, ()=>buildSchemaPLC(currentQuadroPLC()));

function migrate(p){const base=emptyProject();const out=Object.assign(base,p);out.meta=Object.assign(base.meta,p.meta||{});out.plc=Object.assign(base.plc,p.plc||{});["quadri","sbarre","componenti","partenze","sbarreMono","partenzeMono","sbarreDC","partenzeDC","plcModuli","plcIO","sicModuli","sicIO"].forEach(c=>{out[c]=(p[c]||[]).map(r=>Object.assign({_id:uid()},r));});if(p._mylib&&typeof p._mylib==="object"){MYLIB=Object.assign(MYLIB,p._mylib);saveMyLib();}delete out._mylib;return out;}

/* =========================================================
   EVENTI GLOBALI
   ========================================================= */
function wire(){
  // add/clear buttons dentro i fogli
  content.addEventListener("click",e=>{
    const t=e.target;
    if(t.dataset.add){project[t.dataset.add].push(emptyRow(t.dataset.add));renderGrid(t.dataset.add);buildNav();save();}
    if(t.dataset.add5){for(let i=0;i<5;i++)project[t.dataset.add5].push(emptyRow(t.dataset.add5));renderGrid(t.dataset.add5);buildNav();save();}
    if(t.dataset.clear){if(confirm("Svuotare tutte le righe di questo foglio?")){project[t.dataset.clear]=[];renderGrid(t.dataset.clear);buildNav();save();}}
    if(t.dataset.renum==="plcIO"){
      let n=0;
      project.plcIO.forEach(r=>{
        const idx=chIndex(r.canale);
        if(!isNaN(idx)){ const lbl=chLabel(idx); if(r.canale!==lbl){ r.canale=lbl; n++; } }
      });
      renderGrid("plcIO"); save();
      toast(n>0? ("Canali convertiti: "+n) : "Nessun canale da convertire");
    }
    if(t.id==="zIn")zoom(1.2);
    if(t.id==="zOut")zoom(1/1.2);
    if(t.id==="zFit"){currentZoom=1;renderSchema();}
    if(t.id==="schDxf"||t.id==="exDxf")exportDXF();
    if(t.id==="schSvg"||t.id==="exSvg")exportSVG();
    if(t.id==="schPdf"||t.id==="exPdf")exportPDF();
    if(t.id==="exAllPdf")printAll();
    if(t.id==="exJson")exportJSON();
    // Schema monofase
    if(t.id==="zmIn")zoomMono(1.2);
    if(t.id==="zmOut")zoomMono(1/1.2);
    if(t.id==="zmFit"){currentZoomMono=1;renderSchemaMono();}
    if(t.id==="schmDxf")exportDXFMono();
    if(t.id==="schmSvg")exportSVGMono();
    if(t.id==="schmPdf")exportPDFMono();
    // Schema DC
    if(t.id==="zdIn")zoomDC(1.2);
    if(t.id==="zdOut")zoomDC(1/1.2);
    if(t.id==="zdFit"){currentZoomDC=1;renderSchemaDC();}
    if(t.id==="schdDxf")exportDXFDC();
    if(t.id==="schdSvg")exportSVGDC();
    if(t.id==="schdPdf")exportPDFDC();
    // Schema PLC
    if(t.id==="zpIn")zoomPLC(1.2);
    if(t.id==="zpOut")zoomPLC(1/1.2);
    if(t.id==="zpFit"){currentZoomPLC=1;renderSchemaPLC();}
    if(t.id==="schpDxf")exportDXFPLC();
    if(t.id==="schpSvg")exportSVGPLC();
    if(t.id==="schpPdf")exportPDFPLC();
    // Schema Sicurezza
    if(t.id==="zsIn")zoomSic(1.2);
    if(t.id==="zsOut")zoomSic(1/1.2);
    if(t.id==="zsFit"){currentZoomSic=1;renderSchemaSic();}
    if(t.id==="schsDxf")exportDXFSic();
    if(t.id==="schsSvg")exportSVGSic();
    if(t.id==="schsPdf")exportPDFSic();
  });
  content.addEventListener("change",e=>{
    if(e.target.id==="schemaQuadro")renderSchema();
    if(e.target.id==="schemaMonoQuadro")renderSchemaMono();
    if(e.target.id==="schemaDCQuadro")renderSchemaDC();
    if(e.target.id==="schemaPLCQuadro")renderSchemaPLC();
    if(e.target.id==="schemaSicQuadro")renderSchemaSic();
    if(e.target.id==="schemaOrient"){schemaOrient=e.target.value;renderSchema();}
  });

  document.getElementById("btnSave").onclick=exportJSON;
  document.getElementById("btnOpen").onclick=()=>document.getElementById("fileInput").click();
  document.getElementById("btnNew").onclick=()=>{if(confirm("Nuovo progetto vuoto? Le modifiche non salvate andranno perse."))resetProject(emptyProject());};
  document.getElementById("btnExample").onclick=()=>resetProject(exampleProject());
  document.getElementById("fileInput").addEventListener("change",ev=>{
    const f=ev.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{resetProject(migrate(JSON.parse(r.result)));toast("Progetto caricato");}catch(err){alert("File non valido: "+err.message);}};
    r.readAsText(f);ev.target.value="";
  });
}
function resetProject(p){project=p;fillSimpleInputs();renderAllGrids();buildNav();updateSummary();save();if(activeSheet==="schema")renderSchema();if(activeSheet==="schemaMono")renderSchemaMono();if(activeSheet==="schemaDC")renderSchemaDC();if(activeSheet==="schemaPLC")renderSchemaPLC();if(activeSheet==="schemaSic")renderSchemaSic();}
